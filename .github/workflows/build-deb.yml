name: Build and Publish Debian Package

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  build-and-publish:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            distribution: jammy
            component: private
          - os: ubuntu-24.04
            distribution: noble
            component: private

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            dpkg-dev \
            lsb-release \
            libboost-all-dev \
            libeigen3-dev \
            libflann-dev \
            libqhull-dev \
            libusb-1.0-0-dev

      - name: Update package version from tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^PKG_VERSION=.*/PKG_VERSION=\"${TAG_VERSION}\"/" build_deb.sh
          echo "PKG_VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"

      - name: Build Debian package
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Upload .deb to JFrog Artifactory
        env:
          JFROG_URL: https://locusbots.jfrog.io/artifactory
          JFROG_REPO: locusbots-debian-local
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_API_KEY: ${{ secrets.JFROG_API_KEY }}
        run: |
          DEB_FILE=$(find build_deb -name '*.deb' | head -1)
          DEB_BASENAME=$(basename "${DEB_FILE}")
          echo "Uploading ${DEB_BASENAME} to ${JFROG_REPO} (${matrix_dist}/${matrix_comp})"

          curl -f -u "${JFROG_USER}:${JFROG_API_KEY}" \
            -XPUT "${JFROG_URL}/${JFROG_REPO}/pool/libpcl/${DEB_BASENAME};deb.distribution=${{ matrix.distribution }};deb.component=${{ matrix.component }};deb.architecture=$(dpkg --print-architecture)" \
            -T "${DEB_FILE}"
